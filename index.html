<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Spell Cast Indonesia</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 30px;
      width: 380px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }

    h1 {
      margin-bottom: 10px;
      color: #00d4ff;
      text-shadow: 0 0 10px #00d4ff;
    }

    .spell {
      font-size: 28px;
      margin: 20px 0;
      color: #ffd700;
      text-shadow: 0 0 10px #ffd700;
      transition: 0.3s;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      text-align: center;
      font-size: 16px;
      margin-top: 10px;
      background: #111;
      color: white;
      border: 1px solid #00d4ff;
    }

    input:focus {
      box-shadow: 0 0 10px #00d4ff;
    }

    .info {
      margin-top: 15px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: linear-gradient(45deg, #00d4ff, #0077ff);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #00d4ff;
    }

    .status {
      margin-top: 10px;
      font-weight: bold;
      height: 20px;
    }

    .benar {
      color: #00ff88;
      text-shadow: 0 0 5px #00ff88;
    }

    .salah {
      color: #ff4d4d;
      text-shadow: 0 0 5px #ff4d4d;
    }

    .game-over {
      color: #ff4d4d;
      font-size: 22px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🧙 Spell Cast</h1>
  <p>Ketik mantra dengan cepat dan tepat!</p>

  <div class="spell" id="spell">Tekan mulai</div>

  <input type="text" id="input" placeholder="Ketik di sini..." disabled>

  <div class="info">
    <span>⏱️ <span id="waktu">10</span>d</span>
    <span>⭐ <span id="skor">0</span></span>
    <span>🎯 Lv <span id="level">1</span></span>
  </div>

  <div class="status" id="status"></div>

  <button onclick="mulaiGame()">Mulai Game</button>
</div>

<script>
  const daftarMantra = [
    "api", "air", "tanah", "angin",
    "cahaya", "gelap", "petir", "es",
    "bayangan", "energi"
  ];

  let mantraSekarang = "";
  let skor = 0;
  let waktu = 10;
  let level = 1;
  let timer;

  const spell = document.getElementById("spell");
  const input = document.getElementById("input");
  const waktuEl = document.getElementById("waktu");
  const skorEl = document.getElementById("skor");
  const levelEl = document.getElementById("level");
  const status = document.getElementById("status");

  function ambilMantra() {
    return daftarMantra[Math.floor(Math.random() * daftarMantra.length)];
  }

  function mulaiGame() {
    skor = 0;
    waktu = 10;
    level = 1;

    input.disabled = false;
    input.value = "";
    input.focus();

    lanjutMantra();
    updateUI();

    clearInterval(timer);
    timer = setInterval(hitungWaktu, 1000);
  }

  function lanjutMantra() {
    mantraSekarang = ambilMantra();
    spell.textContent = mantraSekarang;
    spell.style.transform = "scale(1.2)";
    setTimeout(() => spell.style.transform = "scale(1)", 200);
  }

  function hitungWaktu() {
    waktu--;
    waktuEl.textContent = waktu;

    if (waktu <= 0) {
      clearInterval(timer);
      selesaiGame();
    }
  }

  function selesaiGame() {
    input.disabled = true;
    spell.textContent = "Game Selesai!";
    status.textContent = "Coba lagi ya!";
    status.className = "status salah";
  }

  function updateUI() {
    skorEl.textContent = skor;
    levelEl.textContent = level;
    waktuEl.textContent = waktu;
  }

  input.addEventListener("input", () => {
    if (input.value.toLowerCase() === mantraSekarang) {
      skor++;
      level = Math.floor(skor / 5) + 1;
      waktu += 2;

      status.textContent = "Benar!";
      status.className = "status benar";

      input.value = "";
      lanjutMantra();
      updateUI();
    }
  });
</script>

</body>
</html>
