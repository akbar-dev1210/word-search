<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Game Spellcast Mini</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #1e1e2f;
  color: white;
}

h1 {
  margin-top: 20px;
}

#grid {
  display: grid;
  grid-template-columns: repeat(5, 60px);
  gap: 10px;
  justify-content: center;
  margin: 20px auto;
}

.tile {
  width: 60px;
  height: 60px;
  background: #2d2d44;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
  border-radius: 10px;
  cursor: pointer;
  user-select: none;
  transition: 0.2s;
}

.tile:hover {
  background: #3a3a5a;
}

.tile.selected {
  background: #4cafef;
}

#info {
  margin-top: 15px;
}

button {
  margin-top: 15px;
  padding: 10px 20px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: #4cafef;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #3a9bdc;
}
</style>

</head>
<body>

<h1>🔮 Spellcast Mini</h1>

<div id="grid"></div>

<div id="info">
  <p>Kata: <span id="kata">-</span></p>
  <p>Skor: <span id="skor">0</span></p>
</div>

<button onclick="resetGame()">Reset Game</button>

<script>
const ukuranGrid = 5;
const huruf = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

let grid = [];
let tileDipilih = [];
let kataSekarang = "";
let skor = 0;

// kamus sederhana (bisa kamu tambah sendiri)
const kamus = [
  "KATA","MAKAN","MINUM","API","AIR","BUKU","GAME","KODE","DATA","BOLA"
];

function hurufAcak() {
  return huruf[Math.floor(Math.random() * huruf.length)];
}

function buatGrid() {
  const gridEl = document.getElementById("grid");
  gridEl.innerHTML = "";
  grid = [];

  for (let i = 0; i < ukuranGrid * ukuranGrid; i++) {
    const h = hurufAcak();
    grid.push(h);

    const tile = document.createElement("div");
    tile.classList.add("tile");
    tile.textContent = h;
    tile.dataset.index = i;

    tile.addEventListener("mousedown", mulaiPilih);
    tile.addEventListener("mouseover", lanjutPilih);

    gridEl.appendChild(tile);
  }
}

function mulaiPilih(e) {
  resetPilihan();
  tambahTile(e.target);
}

function lanjutPilih(e) {
  if (tileDipilih.length > 0 && e.buttons === 1) {
    tambahTile(e.target);
  }
}

function tambahTile(tile) {
  const index = tile.dataset.index;

  if (!tileDipilih.includes(index)) {
    tileDipilih.push(index);
    tile.classList.add("selected");

    kataSekarang += tile.textContent;
    updateTampilan();
  }
}

function resetPilihan() {
  tileDipilih = [];
  kataSekarang = "";

  document.querySelectorAll(".tile").forEach(t => {
    t.classList.remove("selected");
  });

  updateTampilan();
}

function updateTampilan() {
  document.getElementById("kata").textContent = kataSekarang || "-";
  document.getElementById("skor").textContent = skor;
}

document.addEventListener("mouseup", () => {
  cekKata();
  resetPilihan();
});

function cekKata() {
  if (kamus.includes(kataSekarang)) {
    skor += kataSekarang.length * 10;
    alert("✅ Kata benar: " + kataSekarang);
  } else if (kataSekarang.length > 1) {
    alert("❌ Kata tidak ada di kamus");
  }
}

function resetGame() {
  skor = 0;
  buatGrid();
  updateTampilan();
}

// mulai game
buatGrid();
updateTampilan();
</script>

</body>
</html>
